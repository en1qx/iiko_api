networks:
  monitoring:
    external: true
    name: docker_monitoring

services:
  iiko-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: iiko-api:latest
    container_name: iiko-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3